<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第4页 · 手臂有支撑，与心脏同高</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#E8E5DE; }
  .page {
    width:1080px; height:1920px; background:#FDFBF7;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1C2430; position:relative; padding:72px 64px; display:flex; flex-direction:column;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .step-badge {
    background:#14406E; color:#fff; font-size:32px; font-weight:700;
    padding:14px 34px; border-radius:999px; letter-spacing:2px;
  }
  .dots { display:flex; gap:14px; }
  .dot { width:18px; height:18px; border-radius:50%; background:#D8D3C6; }
  .dot.on { background:#14406E; }
  h1 { font-size:72px; font-weight:800; color:#14406E; margin-top:40px; letter-spacing:2px; line-height:1.25; }
  .rule { width:140px; height:10px; background:#C0392B; border-radius:5px; margin-top:24px; }
  .fig-card {
    margin-top:40px; background:#fff; border:4px solid #E3E0D8; border-radius:28px;
    height:800px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .main { font-size:52px; font-weight:800; margin-top:44px; line-height:1.5; }
  .main .hl { color:#14406E; border-bottom:8px solid #F0B429; }
  .src {
    position:absolute; left:64px; right:64px; bottom:52px;
    font-size:24px; color:#5A6472; border-top:2px solid #E3E0D8; padding-top:20px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="step-badge">第 4 步 · 共 6 步</div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <h1>手臂有支撑<br>与心脏同高</h1>
  <div class="rule"></div>

  <div class="fig-card">
    <svg width="940" height="720" viewBox="0 0 940 720">
      <!-- 地板 -->
      <rect x="40" y="660" width="860" height="14" rx="7" fill="#D8D3C6"/>
      <!-- 椅子 -->
      <rect x="120" y="430" width="26" height="230" rx="10" fill="#B08F5E"/>
      <rect x="120" y="430" width="190" height="22" rx="10" fill="#C9A876"/>
      <rect x="96" y="300" width="26" height="152" rx="10" fill="#C9A876"/>
      <!-- 人物：坐姿侧视 -->
      <circle cx="300" cy="160" r="52" fill="#F2C9A0"/>
      <path d="M 262 132 C 270 100 330 100 338 132 C 330 118 270 118 262 132 Z" fill="#8A8F98"/>
      <rect x="248" y="210" width="112" height="180" rx="34" fill="#4E6E9E"/>
      <!-- 大腿（水平，坐于椅面）与小腿（落地） -->
      <rect x="300" y="376" width="210" height="54" rx="26" fill="#33507A"/>
      <rect x="466" y="420" width="48" height="222" rx="22" fill="#33507A"/>
      <rect x="456" y="622" width="124" height="34" rx="16" fill="#1C2430"/>
      <!-- 桌子 -->
      <rect x="400" y="470" width="490" height="22" rx="10" fill="#C9A876"/>
      <rect x="620" y="492" width="26" height="168" fill="#B08F5E"/>
      <rect x="830" y="492" width="26" height="168" fill="#B08F5E"/>
      <!-- 手臂：上臂自然下垂，前臂平放桌面（有支撑） -->
      <rect x="350" y="238" width="52" height="202" rx="24" fill="#F2C9A0"/>
      <rect x="350" y="420" width="290" height="50" rx="24" fill="#F2C9A0"/>
      <ellipse cx="648" cy="445" rx="26" ry="24" fill="#F2C9A0"/>
      <!-- 袖带：上臂中段（中心 y=310） -->
      <rect x="338" y="262" width="76" height="96" rx="18" fill="#1E5AA0"/>
      <rect x="338" y="262" width="76" height="96" rx="18" fill="none" stroke="#123B6D" stroke-width="5"/>
      <rect x="356" y="282" width="40" height="56" rx="8" fill="#fff" opacity="0.85"/>
      <path d="M 414 330 C 440 340 444 356 452 372" fill="none" stroke="#33507A" stroke-width="12" stroke-linecap="round"/>
      <!-- 心脏位置（与袖带中心同一水平线 y=310） -->
      <circle cx="300" cy="310" r="20" fill="#B3261E"/>
      <path d="M 293 304 C 290 299 296 296 300 301 C 304 296 310 299 307 304 C 305 308 300 312 300 312 C 300 312 295 308 293 304 Z" fill="#fff"/>
      <!-- 心脏—袖带 同高虚线 -->
      <line x1="320" y1="310" x2="880" y2="310" stroke="#B3261E" stroke-width="6" stroke-dasharray="18 14"/>
      <!-- 标注 -->
      <g transform="translate(560,150)">
        <rect x="0" y="0" width="320" height="72" rx="16" fill="#B3261E"/>
        <text x="160" y="48" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">与心脏同高</text>
      </g>
      <!-- 支撑标注 -->
      <g transform="translate(560,556)">
        <rect x="0" y="0" width="320" height="72" rx="16" fill="#1E7A46"/>
        <text x="160" y="48" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">桌面支撑手臂</text>
      </g>
    </svg>
  </div>

  <div class="main">手臂放在桌上，<span class="hl">袖带中部与心脏齐平</span></div>

  <div class="src">来源：美国心脏协会（AHA）· Monitoring Your Blood Pressure at Home · heart.org</div>
</div>
</body>
</html>

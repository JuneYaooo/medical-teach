<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第3页 · 袖带直接贴皮肤</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#E8E5DE; }
  .page {
    width:1080px; height:1920px; background:#FDFBF7;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1C2430; position:relative; padding:72px 64px; display:flex; flex-direction:column;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .step-badge {
    background:#14406E; color:#fff; font-size:32px; font-weight:700;
    padding:14px 34px; border-radius:999px; letter-spacing:2px;
  }
  .dots { display:flex; gap:14px; }
  .dot { width:18px; height:18px; border-radius:50%; background:#D8D3C6; }
  .dot.on { background:#14406E; }
  h1 { font-size:72px; font-weight:800; color:#14406E; margin-top:40px; letter-spacing:2px; }
  .rule { width:140px; height:10px; background:#C0392B; border-radius:5px; margin-top:24px; }
  .fig-card {
    margin-top:44px; background:#fff; border:4px solid #E3E0D8; border-radius:28px;
    height:820px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .compare { display:flex; gap:80px; align-items:center; }
  .mark { font-size:96px; font-weight:900; text-align:center; margin-top:26px; }
  .no .mark { color:#B3261E; }
  .yes .mark { color:#1E7A46; }
  .lbl { font-size:40px; font-weight:800; text-align:center; margin-top:6px; }
  .no .lbl { color:#B3261E; }
  .yes .lbl { color:#1E7A46; }
  .main { font-size:56px; font-weight:800; margin-top:44px; line-height:1.4; }
  .main .hl { color:#14406E; border-bottom:8px solid #F0B429; }
  .note {
    margin-top:26px; font-size:28px; color:#5A6472; background:#F4F0E6;
    border-left:10px solid #F0B429; border-radius:0 16px 16px 0; padding:18px 26px; line-height:1.6;
  }
  .src {
    position:absolute; left:64px; right:64px; bottom:52px;
    font-size:24px; color:#5A6472; border-top:2px solid #E3E0D8; padding-top:20px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="step-badge">第 3 步 · 共 6 步</div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot on"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <h1>袖带直接贴皮肤</h1>
  <div class="rule"></div>

  <div class="fig-card">
    <div class="compare">
      <!-- 错误：隔衣测量 -->
      <div class="no">
        <svg width="300" height="520" viewBox="0 0 300 520">
          <!-- 衣袖覆盖的手臂 -->
          <rect x="105" y="60" width="90" height="330" rx="42" fill="#B9C2CC"/>
          <!-- 袖带隔在衣袖外 -->
          <rect x="88" y="160" width="124" height="110" rx="24" fill="#1E5AA0"/>
          <rect x="88" y="160" width="124" height="110" rx="24" fill="none" stroke="#123B6D" stroke-width="6"/>
          <rect x="126" y="182" width="48" height="66" rx="10" fill="#fff" opacity="0.85"/>
          <path d="M 210 210 C 250 220 250 260 236 300" fill="none" stroke="#33507A" stroke-width="13" stroke-linecap="round"/>
          <!-- 手 -->
          <circle cx="150" cy="420" r="34" fill="#F2C9A0"/>
        </svg>
        <div class="mark">✗</div>
        <div class="lbl">隔着衣服</div>
      </div>
      <!-- 正确：贴皮肤 -->
      <div class="yes">
        <svg width="300" height="520" viewBox="0 0 300 520">
          <!-- 裸露上臂 -->
          <rect x="105" y="60" width="90" height="330" rx="42" fill="#F2C9A0"/>
          <!-- 袖带直接贴皮肤 -->
          <rect x="88" y="160" width="124" height="110" rx="24" fill="#1E5AA0"/>
          <rect x="88" y="160" width="124" height="110" rx="24" fill="none" stroke="#123B6D" stroke-width="6"/>
          <rect x="126" y="182" width="48" height="66" rx="10" fill="#fff" opacity="0.85"/>
          <path d="M 210 210 C 250 220 250 260 236 300" fill="none" stroke="#33507A" stroke-width="13" stroke-linecap="round"/>
          <!-- 袖带贴肤高亮 -->
          <rect x="92" y="272" width="116" height="8" rx="4" fill="#1E7A46" opacity="0.9"/>
          <circle cx="150" cy="420" r="34" fill="#F2C9A0"/>
        </svg>
        <div class="mark">✓</div>
        <div class="lbl">直接贴皮肤</div>
      </div>
    </div>
  </div>

  <div class="main"><span class="hl">不隔着衣服</span>量</div>
  <div class="note">袖带位置按设备说明书放置。</div>

  <div class="src">来源：美国心脏协会（AHA）· Monitoring Your Blood Pressure at Home · heart.org</div>
</div>
</body>
</html>

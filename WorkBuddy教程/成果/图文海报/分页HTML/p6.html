<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第6页 · 带上记录，和医生一起看</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#E8E5DE; }
  .page {
    width:1080px; height:1920px; background:#FDFBF7;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1C2430; position:relative; padding:72px 64px; display:flex; flex-direction:column;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .step-badge {
    background:#14406E; color:#fff; font-size:32px; font-weight:700;
    padding:14px 34px; border-radius:999px; letter-spacing:2px;
  }
  .dots { display:flex; gap:14px; }
  .dot { width:18px; height:18px; border-radius:50%; background:#D8D3C6; }
  .dot.on { background:#14406E; }
  h1 { font-size:72px; font-weight:800; color:#14406E; margin-top:40px; letter-spacing:2px; line-height:1.25; }
  .rule { width:140px; height:10px; background:#C0392B; border-radius:5px; margin-top:24px; }
  .fig-card {
    margin-top:40px; background:#fff; border:4px solid #E3E0D8; border-radius:28px;
    height:580px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
  }
  .list { margin-top:36px; display:flex; flex-direction:column; gap:20px; }
  .item {
    display:flex; align-items:flex-start; gap:24px;
    background:#fff; border:4px solid #E3E0D8; border-radius:22px; padding:22px 28px;
  }
  .item .n {
    min-width:56px; height:56px; border-radius:50%; background:#14406E; color:#fff;
    font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .item p { font-size:38px; line-height:1.55; font-weight:600; }
  .item.warn { border-color:#C0392B; background:#FDF3F1; }
  .item.warn .n { background:#C0392B; }
  .src {
    position:absolute; left:64px; right:64px; bottom:52px;
    font-size:24px; color:#5A6472; border-top:2px solid #E3E0D8; padding-top:20px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="step-badge">第 6 步 · 共 6 步</div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot on"></div>
    </div>
  </div>

  <h1>带上记录<br>和医生一起看</h1>
  <div class="rule"></div>

  <div class="fig-card">
    <svg width="940" height="600" viewBox="0 0 940 600">
      <!-- 地板 -->
      <rect x="40" y="560" width="860" height="14" rx="7" fill="#D8D3C6"/>
      <!-- 诊断床/柜 -->
      <rect x="700" y="420" width="200" height="20" rx="8" fill="#C9A876"/>
      <rect x="730" y="440" width="22" height="120" fill="#B08F5E"/>
      <rect x="850" y="440" width="22" height="120" fill="#B08F5E"/>
      <!-- 医生 -->
      <circle cx="330" cy="170" r="58" fill="#F2C9A0"/>
      <path d="M 286 140 C 292 96 368 96 374 140 C 362 122 298 122 286 140 Z" fill="#6B7280"/>
      <rect x="264" y="230" width="132" height="240" rx="36" fill="#EAF1F8" stroke="#9AA3AD" stroke-width="4"/>
      <line x1="330" y1="248" x2="330" y2="452" stroke="#9AA3AD" stroke-width="4"/>
      <rect x="298" y="248" width="20" height="26" rx="6" fill="#B3261E"/>
      <!-- 医生手持记录夹 -->
      <rect x="404" y="300" width="90" height="120" rx="10" fill="#fff" stroke="#1C2430" stroke-width="6"/>
      <rect x="428" y="288" width="42" height="18" rx="8" fill="#1C2430"/>
      <line x1="420" y1="340" x2="478" y2="340" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>
      <line x1="420" y1="366" x2="478" y2="366" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>
      <!-- 老人 -->
      <circle cx="620" cy="200" r="54" fill="#F2C9A0"/>
      <path d="M 580 172 C 586 132 654 132 660 172 C 648 156 592 156 580 172 Z" fill="#C9CDD3"/>
      <rect x="564" y="256" width="112" height="214" rx="34" fill="#B08F5E"/>
      <!-- 老人递出记录本 -->
      <rect x="500" y="330" width="80" height="104" rx="10" fill="#fff" stroke="#1C2430" stroke-width="6"/>
      <line x1="514" y1="362" x2="566" y2="362" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>
      <line x1="514" y1="388" x2="566" y2="388" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>
      <text x="540" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#14406E">记录</text>
      <rect x="480" y="360" width="50" height="34" rx="16" fill="#F2C9A0"/>
      <!-- 对话气泡 -->
      <g transform="translate(430,60)">
        <rect x="0" y="0" width="380" height="84" rx="20" fill="#EAF1F8" stroke="#14406E" stroke-width="4"/>
        <path d="M 80 84 L 66 116 L 108 84 Z" fill="#EAF1F8" stroke="#14406E" stroke-width="4"/>
        <text x="190" y="54" text-anchor="middle" font-size="34" font-weight="800" fill="#14406E">请帮我看看测量记录</text>
      </g>
    </svg>
  </div>

  <div class="list">
    <div class="item"><div class="n">1</div><p>把测量记录和血压计带给医生核对</p></div>
    <div class="item warn"><div class="n">2</div><p>不能只凭一次读数自己下诊断</p></div>
    <div class="item warn"><div class="n">3</div><p>不要自行停药或改药——任何调整都先和医生商量</p></div>
    <div class="item"><div class="n">4</div><p>家庭测量不能替代医生随访</p></div>
  </div>

  <div class="src">来源：美国心脏协会（AHA）· Monitoring Your Blood Pressure at Home · heart.org</div>
</div>
</body>
</html>

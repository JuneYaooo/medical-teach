<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第1页 · 选对血压计</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#E8E5DE; }
  .page {
    width:1080px; height:1920px; background:#FDFBF7;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1C2430; position:relative; padding:72px 64px; display:flex; flex-direction:column;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .step-badge {
    background:#14406E; color:#fff; font-size:32px; font-weight:700;
    padding:14px 34px; border-radius:999px; letter-spacing:2px;
  }
  .dots { display:flex; gap:14px; }
  .dot { width:18px; height:18px; border-radius:50%; background:#D8D3C6; }
  .dot.on { background:#14406E; }
  h1 { font-size:72px; font-weight:800; color:#14406E; margin-top:40px; letter-spacing:2px; }
  .rule { width:140px; height:10px; background:#C0392B; border-radius:5px; margin-top:24px; }
  .fig-card {
    margin-top:44px; background:#fff; border:4px solid #E3E0D8; border-radius:28px;
    height:780px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .main { font-size:56px; font-weight:800; margin-top:48px; line-height:1.4; }
  .main .hl { color:#14406E; border-bottom:8px solid #F0B429; }
  .sub { margin-top:30px; font-size:38px; line-height:1.7; }
  .sub b { color:#14406E; }
  .note {
    margin-top:28px; font-size:28px; color:#5A6472; background:#F4F0E6;
    border-left:10px solid #F0B429; border-radius:0 16px 16px 0; padding:18px 26px; line-height:1.6;
  }
  .src {
    position:absolute; left:64px; right:64px; bottom:52px;
    font-size:24px; color:#5A6472; border-top:2px solid #E3E0D8; padding-top:20px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="step-badge">第 1 步 · 共 6 步</div>
    <div class="dots">
      <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <h1>选对血压计</h1>
  <div class="rule"></div>

  <div class="fig-card">
    <svg width="940" height="700" viewBox="0 0 940 700">
      <!-- 桌面 -->
      <rect x="60" y="560" width="820" height="22" rx="11" fill="#C9A876"/>
      <rect x="110" y="582" width="26" height="80" fill="#B08F5E"/>
      <rect x="804" y="582" width="26" height="80" fill="#B08F5E"/>
      <!-- 血压计机身 -->
      <rect x="170" y="360" width="330" height="200" rx="28" fill="#14406E"/>
      <rect x="200" y="392" width="200" height="110" rx="14" fill="#EAF1F8"/>
      <!-- 屏幕内容：波形示意（不出现具体数值） -->
      <polyline points="216,470 244,470 258,432 274,500 290,448 306,482 322,470 384,470"
                fill="none" stroke="#14406E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="448" cy="420" r="26" fill="#F0B429"/>
      <rect x="418" y="462" width="60" height="14" rx="7" fill="#EAF1F8" opacity="0.8"/>
      <!-- 管路：机身连到袖带 -->
      <path d="M 500 480 C 560 480 570 460 620 434" fill="none" stroke="#33507A" stroke-width="16" stroke-linecap="round"/>
      <!-- 上臂示意：袖带直接包裹上臂中部 -->
      <rect x="640" y="230" width="95" height="340" rx="44" fill="#F2C9A0"/>
      <rect x="622" y="330" width="130" height="110" rx="24" fill="#1E5AA0"/>
      <rect x="622" y="330" width="130" height="110" rx="24" fill="none" stroke="#123B6D" stroke-width="6"/>
      <rect x="658" y="352" width="58" height="66" rx="10" fill="#fff" opacity="0.85"/>
      <!-- 经验证盾形徽标 -->
      <g transform="translate(760,80)">
        <path d="M 60 0 L 120 22 L 120 96 C 120 140 60 168 60 168 C 60 168 0 140 0 96 L 0 22 Z"
              fill="#1E7A46"/>
        <path d="M 34 86 L 54 108 L 92 60" fill="none" stroke="#fff" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="146" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">经验证</text>
      </g>
    </svg>
  </div>

  <div class="main">选 <span class="hl">"上臂式"</span> 自动血压计</div>
  <div class="sub">
    · 选用<b>经过验证</b>的设备<br>
    · <b>袖带尺寸要合适</b>，不松不紧
  </div>
  <div class="note">特殊人群请先咨询医生，确认设备适合使用。</div>

  <div class="src">来源：美国心脏协会（AHA）· Monitoring Your Blood Pressure at Home · heart.org</div>
</div>
</body>
</html>
